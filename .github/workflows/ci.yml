name: "CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/neo4j
        ports:
          - 7474:7474
          - 7687:7687
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-cov pre-commit mypy

      - name: Run pre-commit
        # Run pre-commit on all files to ensure style/quality
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Mypy (non-strict)
        run: mypy datacreek
        continue-on-error: true

      - name: Run Unit Tests
        env:
          # Ensure tests can find the package if installed in editable mode or site-packages
          PYTHONPATH: .
        run: |
          pytest tests/unit -v --cov=datacreek --cov-report=xml

  # GPU tests - functionality check only (runs on CPU runners but checks imports/setup generally)
  # Real GPU testing requires self-hosted runners or specific instances not guaranteed here.
  gpu:
    name: GPU Tests (Mock/Compat)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest
      - name: Run GPU-marked tests
        # We might not have a GPU, but we run the tests marked as gpu to check for import errors or logic that doesn't strictly adhere to hardware presence (or mocks it)
        # If they absolutely require GPU, they will skip or fail. For now, we try to run them.
        run: |
          pytest -m gpu -q || echo "GPU tests failed or skipped (expected if no GPU)"

  # E2E Pipeline
  pipeline-e2e:
    name: E2E Pipeline
    needs: unit
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/neo4j
        ports:
          - 7474:7474
          - 7687:7687
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest fakeredis
      - name: Run E2E Tests
        run: PYTHONPATH=. pytest tests/e2e/test_pipeline_e2e.py -q
